<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp — Abastecimentos</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app-tech.css">
</head>
<body>

<div class="fundo-grade" aria-hidden="true"></div>

<header class="topo">
  <a href="veiculos.html" class="nav-logo">
    <img class="nav-logo-icone" src="img/logo.png" alt="">
    GearUp
  </a>
  <div class="topo-usuario">
    <span id="nomeUsuarioTopo"></span>
    <button id="btnSair" class="btn-sair">Sair</button>
  </div>
</header>

<div class="layout-app">
  <aside class="menu-lateral" id="menuLateral"></aside>

  <main class="conteudo-app">
    <div class="cabecalho-pagina">
      <div>
        <span class="etiqueta-tecnica">GU · ABS</span>
        <h2>Abastecimentos</h2>
        <p>Histórico de combustível e consumo médio</p>
      </div>
      <button class="btn btn-primario" id="btnNova">+ Novo abastecimento</button>
    </div>

    <div id="grid-indicadores" class="grid-indicadores"></div>

    <table class="tabela-dados">
      <thead>
        <tr>
          <th>Data</th>
          <th>Posto</th>
          <th>Litros</th>
          <th>Valor</th>
          <th>Km</th>
          <th>Consumo</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </main>
</div>

<!-- ===== MODAL DE CADASTRO/EDIÇÃO ===== -->
<div id="modal" class="modal-fundo oculto">
  <div class="modal-caixa">
    <span class="etiqueta-tecnica">GU · ABS</span>
    <h3 class="modal-titulo" id="tituloModal">Novo abastecimento</h3>

    <div id="mensagemModal" class="mensagem mensagem-erro oculto"></div>

    <form id="formItem">
      <input type="hidden" id="itemId">

      <div class="linha-2-colunas">
        <div class="campo-form">
          <label for="dataAbastecimento">Data *</label>
          <input type="date" id="dataAbastecimento" required>
        </div>
        <div class="campo-form">
          <label for="posto">Posto</label>
          <input type="text" id="posto" placeholder="Ex: Posto Ipiranga">
        </div>
      </div>

      <div class="linha-2-colunas">
        <div class="campo-form">
          <label for="tipoCombustivel">Combustível *</label>
          <select id="tipoCombustivel" required>
            <option value="">Selecione</option>
            <option value="Gasolina">Gasolina</option>
            <option value="Etanol">Etanol</option>
            <option value="Flex">Flex</option>
            <option value="Diesel">Diesel</option>
            <option value="GNV">GNV</option>
          </select>
        </div>
        <div class="campo-form">
          <label for="litros">Litros *</label>
          <input type="number" id="litros" min="0" step="0.001" required>
        </div>
      </div>

      <div class="linha-2-colunas">
        <div class="campo-form">
          <label for="valorTotal">Valor total (R$) *</label>
          <input type="number" id="valorTotal" min="0" step="0.01" required>
        </div>
        <div class="campo-form">
          <label for="quilometragem">Quilometragem *</label>
          <input type="number" id="quilometragem" min="0" required>
        </div>
      </div>

      <label class="campo-checkbox">
        <input type="checkbox" id="tanqueCheio" checked>
        Tanque cheio (deixa o cálculo de consumo mais preciso)
      </label>

      <div class="modal-acoes">
        <button type="button" class="btn btn-secundario" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primario" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/menu-lateral.js"></script>
<script src="js/abastecimentos.js"></script>
</body>
</html>
