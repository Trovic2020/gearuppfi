<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GearUp - Alertas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tabela.css">
</head>
<body>

  <header class="topo">
    <div class="topo-logo">🚗 GearUp</div>
    <div class="topo-usuario">
      <span id="nomeUsuarioTopo"></span>
      <button id="btnSair">Sair</button>
    </div>
  </header>

  <div class="layout-veiculo">
    <aside class="menu-lateral" id="menuLateral"></aside>

    <main class="conteudo-veiculo">
      <div class="cabecalho-pagina">
        <div>
          <h2>Alertas</h2>
          <p>Fique de olho no que precisa de atenção</p>
        </div>
      </div>

      <div class="filtro-tabs">
        <button class="filtro-tab ativo" data-status="Pendente">Pendentes</button>
        <button class="filtro-tab" data-status="Resolvido">Resolvidos</button>
        <button class="filtro-tab" data-status="Ignorado">Ignorados</button>
        <button class="filtro-tab" data-status="">Todos</button>
      </div>

      <div id="listaAlertas" class="lista-alertas"></div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/menu-lateral.js"></script>
  <script src="js/alertas.js"></script>
</body>
</html>
