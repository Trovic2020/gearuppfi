<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp — Alertas</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app-tech.css">
</head>
<body>

<div class="fundo-grade" aria-hidden="true"></div>

<header class="topo">
  <a href="veiculos.html" class="nav-logo">
    <img class="nav-logo-icone" src="img/logo.png" alt="">
    GearUp
  </a>
  <div class="topo-usuario">
    <span id="nomeUsuarioTopo"></span>
    <button id="btnSair" class="btn-sair">Sair</button>
  </div>
</header>

<div class="layout-app">
  <aside class="menu-lateral" id="menuLateral"></aside>

  <main class="conteudo-app">
    <div class="cabecalho-pagina">
      <div>
        <span class="etiqueta-tecnica">GU · ALR</span>
        <h2>Alertas</h2>
        <p>Fique de olho no que precisa de atenção</p>
      </div>
    </div>

    <div class="filtro-tabs">
      <button class="filtro-tab ativo" data-status="Pendente">Pendentes</button>
      <button class="filtro-tab" data-status="Resolvido">Resolvidos</button>
      <button class="filtro-tab" data-status="Ignorado">Ignorados</button>
      <button class="filtro-tab" data-status="">Todos</button>
    </div>

    <div id="listaAlertas" class="lista-alertas"></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/menu-lateral.js"></script>
<script src="js/alertas.js"></script>
</body>
</html>
