<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GearUp - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="tela-auth">
    <div class="caixa-auth">
      <div class="logo-auth">
        <h1>🚗 GearUp</h1>
        <p>Crie sua conta gratuitamente</p>
      </div>

      <form class="form-auth" id="formCadastro">
        <div id="mensagemCadastro" class="mensagem mensagem-erro oculto"></div>

        <div class="campo-form">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="campo-form">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="campo-form">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
        </div>

        <div class="campo-form">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <div class="campo-form">
          <label for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primario btn-full" id="btnCadastro">Criar conta</button>

        <p class="link-auth">
          Já tem uma conta? <a href="index.html">Faça login</a>
        </p>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
