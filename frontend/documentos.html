<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp — Documentos</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app-tech.css">
</head>
<body>

<div class="fundo-grade" aria-hidden="true"></div>

<header class="topo">
  <a href="veiculos.html" class="nav-logo">
    <img class="nav-logo-icone" src="img/logo.png" alt="">
    GearUp
  </a>
  <div class="topo-usuario">
    <span id="nomeUsuarioTopo"></span>
    <button id="btnSair" class="btn-sair">Sair</button>
  </div>
</header>

<div class="layout-app">
  <aside class="menu-lateral" id="menuLateral"></aside>

  <main class="conteudo-app">
    <div class="cabecalho-pagina">
      <div>
        <span class="etiqueta-tecnica">GU · DOC</span>
        <h2>Documentos</h2>
        <p>Central de documentos digitais do veículo</p>
      </div>
      <button class="btn btn-primario" id="btnNova">+ Enviar documento</button>
    </div>

    <div id="gridDocumentos" class="grid-documentos"></div>
  </main>
</div>

<!-- ===== MODAL DE UPLOAD ===== -->
<div id="modal" class="modal-fundo oculto">
  <div class="modal-caixa">
    <span class="etiqueta-tecnica">GU · DOC</span>
    <h3 class="modal-titulo">Enviar documento</h3>

    <div id="mensagemModal" class="mensagem mensagem-erro oculto"></div>

    <form id="formItem">
      <div class="campo-form">
        <label for="tipoDocumento">Tipo de documento *</label>
        <select id="tipoDocumento" required>
          <option value="">Selecione</option>
          <option value="CRLV">CRLV</option>
          <option value="Licenciamento">Licenciamento</option>
          <option value="IPVA">IPVA</option>
          <option value="Seguro">Seguro</option>
          <option value="Laudo">Laudo</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="campo-form">
        <label for="dataVencimento">Data de vencimento <span style="text-transform:none;">(se houver)</span></label>
        <input type="date" id="dataVencimento">
      </div>

      <div class="campo-form">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" rows="2"></textarea>
      </div>

      <div class="campo-form">
        <label for="arquivo">Arquivo (PDF, JPG ou PNG) *</label>
        <input type="file" id="arquivo" accept=".pdf,.jpg,.jpeg,.png" required>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn btn-secundario" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primario" id="btnSalvar">Enviar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/menu-lateral.js"></script>
<script src="js/documentos.js"></script>
</body>
</html>
