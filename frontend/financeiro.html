<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp — Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app-tech.css">
</head>
<body>

<div class="fundo-grade" aria-hidden="true"></div>

<header class="topo">
  <a href="veiculos.html" class="nav-logo">
    <span class="nav-logo-icone">◈</span>
    GearUp
  </a>
  <div class="topo-usuario">
    <span id="nomeUsuarioTopo"></span>
    <button id="btnSair" class="btn-sair">Sair</button>
  </div>
</header>

<div class="layout-app">
  <aside class="menu-lateral" id="menuLateral"></aside>

  <main class="conteudo-app">
    <div class="cabecalho-pagina">
      <div>
        <span class="etiqueta-tecnica">GU · FIN</span>
        <h2>Financeiro</h2>
        <p>Todos os gastos do veículo, por categoria e período</p>
      </div>
      <button class="btn btn-primario" id="btnNova">+ Lançar gasto</button>
    </div>

    <div class="grid-graficos">
      <div class="card-grafico">
        <h4>Gastos por categoria</h4>
        <div id="graficoCategoria"></div>
      </div>
      <div class="card-grafico">
        <h4>Gastos mensais</h4>
        <div id="graficoMensal"></div>
      </div>
    </div>

    <div class="subcabecalho">
      <h3>Todos os lançamentos</h3>
      <select id="filtroCategoria" class="select-filtro">
        <option value="">Todas as categorias</option>
        <option value="Combustível">Combustível</option>
        <option value="Manutenção">Manutenção</option>
        <option value="Seguro">Seguro</option>
        <option value="Pneus">Pneus</option>
        <option value="Documentação">Documentação</option>
        <option value="Outros">Outros</option>
      </select>
    </div>

    <table class="tabela-dados">
      <thead>
        <tr>
          <th>Data</th>
          <th>Categoria</th>
          <th>Descrição</th>
          <th>Origem</th>
          <th>Valor</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </main>
</div>

<!-- ===== MODAL DE LANÇAMENTO MANUAL ===== -->
<div id="modal" class="modal-fundo oculto">
  <div class="modal-caixa">
    <span class="etiqueta-tecnica">GU · FIN</span>
    <h3 class="modal-titulo">Lançar gasto manual</h3>

    <div id="mensagemModal" class="mensagem mensagem-erro oculto"></div>

    <form id="formItem">
      <div class="campo-form">
        <label for="categoria">Categoria *</label>
        <select id="categoria" required>
          <option value="">Selecione</option>
          <option value="Combustível">Combustível</option>
          <option value="Manutenção">Manutenção</option>
          <option value="Seguro">Seguro</option>
          <option value="Pneus">Pneus</option>
          <option value="Documentação">Documentação</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="campo-form">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Lavagem completa">
      </div>

      <div class="linha-2-colunas">
        <div class="campo-form">
          <label for="valor">Valor (R$) *</label>
          <input type="number" id="valor" min="0" step="0.01" required>
        </div>
        <div class="campo-form">
          <label for="dataGasto">Data *</label>
          <input type="date" id="dataGasto" required>
        </div>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn btn-secundario" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primario" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/menu-lateral.js"></script>
<script src="js/financeiro.js"></script>
</body>
</html>
