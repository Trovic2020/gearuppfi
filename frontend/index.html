<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GearUp - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="tela-auth">
    <div class="caixa-auth">
      <div class="logo-auth">
        <h1>🚗 GearUp</h1>
        <p>Gerencie seu veículo em um só lugar</p>
      </div>

      <form class="form-auth" id="formLogin">
        <div id="mensagemLogin" class="mensagem mensagem-erro oculto"></div>

        <div class="campo-form">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="campo-form">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
        </div>

        <div class="esqueci-senha">
          <a href="esqueci-senha.html">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn btn-primario btn-full" id="btnLogin">Entrar</button>

        <p class="link-auth">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </form>
    </div>
  </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
