<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp — Oficinas</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app-tech.css">
</head>
<body>

<header class="topo">
  <a href="veiculos.html" class="nav-logo">
    <img class="nav-logo-icone" src="img/logo.png" alt="">
    GearUp
  </a>
  <div class="topo-usuario">
    <span id="nomeUsuarioTopo"></span>
    <button id="btnSair" class="btn-sair">Sair</button>
  </div>
</header>

<div class="layout-app">
  <aside class="menu-lateral" id="menuLateral"></aside>

  <main class="conteudo-app">
    <div class="cabecalho-pagina">
      <div>
        <h2>Oficinas</h2>
        <p>Compartilhadas entre todos os seus veículos</p>
      </div>
      <button class="btn btn-primario" id="btnNova">+ Nova oficina</button>
    </div>

    <table class="tabela-dados">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Cidade</th>
          <th>Endereço</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </main>
</div>

<!-- ===== MODAL DE CADASTRO/EDIÇÃO ===== -->
<div id="modal" class="modal-fundo oculto">
  <div class="modal-caixa">
    <h3 class="modal-titulo" id="tituloModal">Nova oficina</h3>

    <div id="mensagemModal" class="mensagem mensagem-erro oculto"></div>

    <form id="formItem">
      <input type="hidden" id="itemId">

      <div class="campo-form">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" required>
      </div>

      <div class="linha-2-colunas">
        <div class="campo-form">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone">
        </div>
        <div class="campo-form">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade">
        </div>
      </div>

      <div class="campo-form">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco">
      </div>

      <div class="campo-form">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" rows="2"></textarea>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn btn-secundario" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primario" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/menu-lateral.js"></script>
<script src="js/oficinas.js"></script>
</body>
</html>
