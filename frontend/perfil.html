<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GearUp - Meu Perfil</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <header class="topo">
    <div class="topo-logo">🚗 GearUp</div>
    <div class="topo-usuario">
      <a href="veiculos.html" style="font-size: 14px; color: var(--azul-escuro); font-weight: 600;">← Meus Veículos</a>
      <button id="btnSair">Sair</button>
    </div>
  </header>

  <div class="container-pagina" style="max-width: 560px;">
    <div class="cabecalho-pagina">
      <div>
        <h2>Meu Perfil</h2>
        <p>Gerencie suas informações pessoais e senha</p>
      </div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
      <h3 style="font-size: 15px; margin-bottom: 16px;">Dados pessoais</h3>

      <div id="mensagemPerfil" class="mensagem mensagem-erro oculto"></div>

      <form id="formPerfil">
        <div class="campo-form">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" required>
        </div>

        <div class="campo-form">
          <label for="email">E-mail (não pode ser alterado)</label>
          <input type="email" id="email" disabled style="background-color: var(--cinza-claro);">
        </div>

        <div class="campo-form">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone">
        </div>

        <button type="submit" class="btn btn-primario" id="btnSalvarPerfil">Salvar alterações</button>
      </form>
    </div>

    <div class="card">
      <h3 style="font-size: 15px; margin-bottom: 16px;">Alterar senha</h3>

      <div id="mensagemSenha" class="mensagem mensagem-erro oculto"></div>

      <form id="formSenha">
        <div class="campo-form">
          <label for="senhaAtual">Senha atual</label>
          <input type="password" id="senhaAtual" required>
        </div>

        <div class="campo-form">
          <label for="novaSenha">Nova senha</label>
          <input type="password" id="novaSenha" required minlength="6">
        </div>

        <div class="campo-form">
          <label for="confirmarNovaSenha">Confirmar nova senha</label>
          <input type="password" id="confirmarNovaSenha" required minlength="6">
        </div>

        <button type="submit" class="btn btn-secundario" id="btnSalvarSenha">Alterar senha</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
