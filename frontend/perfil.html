<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearUp — Meu Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app-tech.css">
</head>
<body>

<div class="fundo-grade" aria-hidden="true"></div>

<header class="topo">
  <a href="veiculos.html" class="nav-logo">
    <span class="nav-logo-icone">◈</span>
    GearUp
  </a>
  <div class="topo-usuario">
    <a href="veiculos.html" class="topo-link">← Meus veículos</a>
    <button id="btnSair" class="btn-sair">Sair</button>
  </div>
</header>

<div class="container-pagina" style="max-width: 600px;">
  <div class="cabecalho-pagina">
    <div>
      <span class="etiqueta-tecnica">GU · PERFIL</span>
      <h2>Meu perfil</h2>
      <p>Gerencie suas informações pessoais e senha</p>
    </div>
  </div>

  <!-- ===== DADOS PESSOAIS ===== -->
  <div class="painel-secao">
    <h3>Dados pessoais</h3>

    <div id="mensagemPerfil" class="mensagem mensagem-erro oculto"></div>

    <form id="formPerfil">
      <div class="campo-form">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>
      </div>

      <div class="campo-form">
        <label for="email">E-mail <span style="text-transform:none;">(não pode ser alterado)</span></label>
        <input type="email" id="email" disabled>
      </div>

      <div class="campo-form">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone">
      </div>

      <button type="submit" class="btn btn-primario" id="btnSalvarPerfil">Salvar alterações</button>
    </form>
  </div>

  <!-- ===== ALTERAR SENHA ===== -->
  <div class="painel-secao">
    <h3>Alterar senha</h3>

    <div id="mensagemSenha" class="mensagem mensagem-erro oculto"></div>

    <form id="formSenha">
      <div class="campo-form">
        <label for="senhaAtual">Senha atual</label>
        <input type="password" id="senhaAtual" required>
      </div>

      <div class="campo-form">
        <label for="novaSenha">Nova senha</label>
        <input type="password" id="novaSenha" required minlength="6">
      </div>

      <div class="campo-form">
        <label for="confirmarNovaSenha">Confirmar nova senha</label>
        <input type="password" id="confirmarNovaSenha" required minlength="6">
      </div>

      <button type="submit" class="btn btn-secundario" id="btnSalvarSenha">Alterar senha</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
